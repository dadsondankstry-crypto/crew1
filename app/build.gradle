plugins { id 'com.android.application' }

android {
    namespace 'com.exemplo.minhaescala'
    compileSdk 35

    defaultConfig {
        applicationId 'com.exemplo.minhaescala'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    // Modelo OCR incluido no APK: funciona OFFLINE apos instalar.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
